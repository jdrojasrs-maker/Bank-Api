name: bank-servicebus-local

# Emulador local de Azure Service Bus + SQL Server (almacenamiento interno del emulador).
# Basado en Docker-Compose-Template/ de azure-service-bus-emulator-installer,
# usando mssql/server:2022-latest en lugar de Azure SQL Edge.
# Variables: ver .env.example (copiar a .env, que no se versiona).

services:
  sqlserver:
    container_name: bank-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      sb-emulator:
        aliases:
          - "sqlserver"

  emulator:
    container_name: bank-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "${CONFIG_PATH:-./Config.json}:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      ACCEPT_EULA: ${ACCEPT_EULA}
      SQL_WAIT_INTERVAL: ${SQL_WAIT_INTERVAL:-15}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"

networks:
  sb-emulator:
