name: bank-servicebus-local

# Local Azure Service Bus emulator + SQL Server (the emulator's internal storage).
# Based on Docker-Compose-Template/ from azure-service-bus-emulator-installer,
# using mssql/server:2022-latest instead of Azure SQL Edge.
# Variables: see .env.example (copy it to .env, which is not versioned).

services:
  sqlserver:
    container_name: bank-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"   # only reachable from this machine; used by the services run with dotnet run
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      sb-emulator:
        aliases:
          - "sqlserver"

  emulator:
    container_name: bank-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "${CONFIG_PATH:-./Config.json}:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      ACCEPT_EULA: ${ACCEPT_EULA}
      SQL_WAIT_INTERVAL: ${SQL_WAIT_INTERVAL:-15}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"

networks:
  sb-emulator:
