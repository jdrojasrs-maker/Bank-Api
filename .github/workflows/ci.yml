name: CI

# Continuous integration: builds the whole solution and runs the Transfer, Transaction, Balance and Notification tests.
# The Transfer, Transaction and Balance tests start their own SQL Server in a container (Testcontainers) with the runner's
# Docker; the Notification tests do not use a database. None of them needs secrets.
# Checks that must be required in branch protection: "Build", "Tests (Transfer)", "Tests (Transaction)",
# "Tests (Balance)" y "Tests (Notification)".

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A new run on the same pull request cancels the previous one; on main/develop it is never canceled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Bank.slnx

      - name: Build (Release)
        run: dotnet build Bank.slnx --configuration Release --no-restore

      # Informational: does not block the pipeline. Transitive Pkcs pinned to 10.0.14 in the services with SQL.
      - name: Audit vulnerable packages (informational)
        continue-on-error: true
        run: |
          for project in $(git ls-files '*.csproj'); do
            echo "::group::$project"
            dotnet list "$project" package --vulnerable --include-transitive
            echo "::endgroup::"
          done

  tests:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [Transfer, Transaction, Balance, Notification]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Bank.${{ matrix.service }}.Api.Tests

      - name: Build (Release)
        run: dotnet build tests/Bank.${{ matrix.service }}.Api.Tests --configuration Release --no-restore

      # Docker viene preinstalado en ubuntu-latest; Testcontainers descarga y arranca SQL Server 2022 (no aplica a Notification).
      - name: Run tests
        run: >
          dotnet test tests/Bank.${{ matrix.service }}.Api.Tests
          --configuration Release --no-build
          --logger "trx;LogFileName=${{ matrix.service }}.trx"
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.service }}
          path: TestResults/*.trx
          if-no-files-found: warn
