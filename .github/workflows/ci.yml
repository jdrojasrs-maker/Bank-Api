name: CI

# Integración continua: compila toda la solución y ejecuta las pruebas de Transfer y Transaction.
# Las pruebas levantan su propio SQL Server en contenedor (Testcontainers), así que no necesitan secretos.
# Checks que deben exigirse en la protección de ramas: "Build", "Tests (Transfer)" y "Tests (Transaction)".

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Una ejecución nueva sobre el mismo pull request cancela la anterior; en main/develop nunca se cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore Bank.slnx

      - name: Compilar (Release)
        run: dotnet build Bank.slnx --configuration Release --no-restore

      # Informativo: no bloquea el pipeline. Pkcs transitivo fijado en 10.0.14 en los servicios con SQL.
      - name: Auditar paquetes vulnerables (informativo)
        continue-on-error: true
        run: |
          for project in $(git ls-files '*.csproj'); do
            echo "::group::$project"
            dotnet list "$project" package --vulnerable --include-transitive
            echo "::endgroup::"
          done

  tests:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [Transfer, Transaction]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore tests/Bank.${{ matrix.service }}.Api.Tests

      - name: Compilar (Release)
        run: dotnet build tests/Bank.${{ matrix.service }}.Api.Tests --configuration Release --no-restore

      # Docker viene preinstalado en ubuntu-latest; Testcontainers descarga y arranca SQL Server 2022.
      - name: Ejecutar pruebas
        run: >
          dotnet test tests/Bank.${{ matrix.service }}.Api.Tests
          --configuration Release --no-build
          --logger "trx;LogFileName=${{ matrix.service }}.trx"
          --results-directory TestResults

      - name: Publicar resultados de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.service }}
          path: TestResults/*.trx
          if-no-files-found: warn
